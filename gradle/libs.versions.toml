# Version catalog: the single place where dependency versions are declared.
# build.gradle refers to these entries as libs.<alias> (dashes become dots).
# Dependabot keeps them up to date (.github/dependabot.yml).

[versions]
junit = "6.1.3"
selenide = "7.19.0"
retrofit = "3.0.0"
okhttp = "4.12.0"       # must match the OkHttp version Retrofit is built against
jackson = "2.22.3"
assertj = "3.27.7"
datafaker = "2.7.0"
allure = "3.0.0"
allureCli = "2.46.1"
aspectj = "1.9.25"
slf4j = "2.0.20"

[libraries]
# The BOMs pin versions of all JUnit / Allure artifacts, so the entries below need no version.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

allure-bom = { module = "io.qameta.allure:allure-bom", version.ref = "allure" }
allure-java-commons = { module = "io.qameta.allure:allure-java-commons" }
allure-junit5 = { module = "io.qameta.allure:allure-junit5" }
allure-selenide = { module = "io.qameta.allure:allure-selenide" }
allure-okhttp3 = { module = "io.qameta.allure:allure-okhttp3" }
allure-commandline = { module = "io.qameta.allure:allure-commandline", version.ref = "allureCli" }
aspectjweaver = { module = "org.aspectj:aspectjweaver", version.ref = "aspectj" }

selenide = { module = "com.codeborne:selenide", version.ref = "selenide" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-jackson = { module = "com.squareup.retrofit2:converter-jackson", version.ref = "retrofit" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

datafaker = { module = "net.datafaker:datafaker", version.ref = "datafaker" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
