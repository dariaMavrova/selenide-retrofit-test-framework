name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly run: catches changes on the sites under test, not only in this code.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [api, ui]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      # ubuntu-latest ships with Google Chrome, which Selenide drives headless.
      - name: Run ${{ matrix.suite }} tests
        run: ./gradlew ${{ matrix.suite }}Test

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.suite }}
          path: build/allure-results
          retention-days: 14

      - name: Upload Gradle and Selenide reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.suite }}
          path: |
            build/reports/tests/
            build/reports/selenide/
          retention-days: 14

  report:
    name: Allure report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Collect results of all suites
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: build/allure-results

      - name: Generate report
        run: ./gradlew allureReport

      - name: Upload report for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/reports/allure-report

  deploy:
    name: Publish report
    needs: report
    # Only main is published; pull requests keep the report as a downloadable artifact.
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
